# What gets measured, on which AI "surfaces", and how often.
category: "Women's contemporary fashion"
focus_brand: Aritzia
runs_per_prompt: 3          # repeats of every prompt per surface (stability needs >= 2)
temperature: 1.0            # default sampling temperature of consumer products is around 1
surfaces:
  - id: gemini-flash
    provider: gemini
    model: gemini-2.5-flash
    grounded: false         # model knowledge only
  - id: gemini-flash-search
    provider: gemini
    model: gemini-2.5-flash
    grounded: true          # same model, with Google Search grounding (what shoppers see in AI answers with sources)
  - id: claude-sonnet
    provider: anthropic
    model: claude-sonnet-5-5
    grounded: false         # model knowledge only
  - id: claude-sonnet-search
    provider: anthropic
    model: claude-sonnet-5-5
    grounded: true          # Claude with its server-side web search tool
    runs: 2                 # search answers cost ~15x more (retrieved pages count as input), so 2 repeats instead of 3
extractor:
  provider: gemini
  model: gemini-2.5-flash-lite
  fallback_model: gemini-2.5-flash   # used when the primary model fails on a particular answer
