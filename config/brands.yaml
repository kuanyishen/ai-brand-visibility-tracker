# Canonical brands the study tracks. `aliases` match case-insensitively on word boundaries;
# `cs` aliases are case-sensitive (used for names that are also ordinary words).
# Unknown brands are still discovered by the LLM extractor and reported as "other".
brands:
  # ---- focus brand and its own labels ----
  - {name: Aritzia, type: focus, focus: true, aliases: [Aritzia, Wilfred, Babaton, "Super Puff", "Denim Forum", "The Group by Babaton"], cs: ["Sunday Best", TNA, Tna]}
